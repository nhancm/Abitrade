mode: "simulation"  # "simulation" (Giả lập Paper Trade) hoặc "live" (Đặt tiền thật Viva88)

bankroll:
  initial_capital: 10000.0   # Vốn khởi điểm (Khi chạy mode "live" sẽ tự động đồng bộ theo số dư thật của từng tài khoản)
  kelly_fraction: 0.25       # 1/4 Kelly để an toàn vốn khi đánh 1 cửa
  min_stake: 10.0            # Cược tối thiểu mặc định (Khi chạy "live" sẽ tự động lấy min_bet thực tế từ sảnh Saba)
  max_stake_percent: 3.0     # Tối đa 3% tổng vốn cho 1 mã cược
  round_step: 5              # Làm tròn tiền cược (bội số của 5) chống soi tài khoản
  daily_stop_loss_pct: 15.0  # Tự động ngắt bảo vệ tài khoản trong ngày nếu âm vượt quá -15% vốn
  warmup_live_bets: 10       # 10 vé Live đầu tiên tự động đi đều mức min_stake của sảnh để đo tốc độ khớp vé & độ ổn định Proxy

strategy:
  min_win_prob: 0.595        # Nâng ngưỡng Winrate thực tối thiểu lên 59.5% (Loại bỏ vùng nhiễu 58.0%-58.5% từ log VPS)
  max_win_prob: 0.75         # Tránh kèo ăn quá thấp (Odds < 1.33)
  min_ev_percent: 4.2        # Nâng lợi nhuận kỳ vọng tối thiểu lên +4.2% EV (Tập trung các kèo chất lượng cao)
  steam_drop_ticks: 0.08     # Bắt sóng Steam khi Pinnacle tụt >= 8 xu trong < 120s
  steam_window_sec: 120
  one_shot_per_market: true  # BẮT BUỘC: Chỉ đánh 1 cửa/trận/loại kèo, không bù khi nhảy line
  one_bet_per_match: true    # Chống thua kép: Mỗi trận chỉ chọn 1 mã có +EV cao nhất
  max_running_tickets: 10    # Giới hạn tối đa 10 vé RUNNING cùng lúc để bảo toàn vốn khả dụng
  live_min_minute: 28        # Khung giờ vàng Kèo Rung: Chỉ vào từ phút 28' (cuối H1 & đầu/giữa H2)
  live_max_minute: 68        # CẤM vào kèo sau phút 68' (tránh rủi ro cuối trận câu giờ)
  max_live_goal_diff: 2      # CẤM vào kèo khi cách biệt tỉ số đã >= 3 bàn (trận đấu đã an bài)
  min_live_sot: 2            # Bắt buộc trận Live phải có ít nhất 2 cú sút trúng đích (chống trận đá chết / mất thống kê)
  min_live_da: 22            # Bắt buộc tổng Tấn công nguy hiểm (Dangerous Attacks) >= 22
  markets_enabled:
    - "HDP"                  # Kèo chấp Châu Á
    - "OU"                   # Tài Xỉu bàn thắng
    - "CORNER_OU"            # Tài Xỉu phạt góc
    - "CORNER_HDP"           # Chấp phạt góc
  phases_enabled:
    - "PREMATCH"
    - "LIVE"

sharp_feed:
  provider: "hybrid"         # "the_odds_api" | "pinnacle_public" | "hybrid"
  the_odds_api_key: ""       # Điền free key từ https://the-odds-api.com (500 req/tháng miễn phí)
  poll_interval_sec: 5

viva88:
  base_url: "https://www.bong88.com"
  fallback_urls:
    - "https://www.bong88.com"
    - "https://www.viva88.net"
    - "https://www.viva88.com"
  agent_url: "https://agn.viva88.net"
  username: "YOUR_VIVA88_USER"
  password: "YOUR_VIVA88_PASS"
  proxy: ""                  # Chuỗi Proxy HCM (Hỗ trợ mọi định dạng: ip:port:user:pass hoặc http://user:pass@ip:port)
  odds_type: "DEC"           # Quy đổi nội bộ về Decimal để tính toán chuẩn xác
  max_slippage: 0.02         # Hủy lệnh nếu lúc GetTicket giá Viva88 tụt quá 2 xu
  live_waiting_delay_sec: 3  # Giả lập thời gian Saba treo vé "Waiting" khi đánh kèo Rung

multi_account:
  strict_proxy_killswitch: true  # Khi chạy mode "live" nhiều tài khoản: Bắt buộc mỗi TK phải có Proxy sống, rớt Proxy tự ngắt TK đó
  stagger_min_sec: 0.4           # Độ trễ lệch pha tối thiểu giữa các tài khoản khi cùng bắn 1 mã kèo
  stagger_max_sec: 2.2           # Độ trễ lệch pha tối đa giữa các tài khoản chống Saba phát hiện đánh theo nhóm
  stake_jitter_pct: 0.10         # Biến thiên nhẹ tiền cược (+/- 10%) giữa các tài khoản
